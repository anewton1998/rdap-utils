name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
            ext: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            name: linux-aarch64
            ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            name: apple-aarch64
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            ext: zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Cross-compile toolchain for Linux aarch64 (only needed on x86 runners)
      - name: Install aarch64 cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build (release)
        run: cargo build --release --target "${{ matrix.target }}"

      - name: Package binaries
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          NAME: ${{ matrix.name }}
          OS: ${{ runner.os }}
        run: |
          BINARIES="find-ip-networks find-protected-domains networks-of-nameservers"
          DEST="rdap-utils-${NAME}"
          mkdir -p "$DEST"

          for bin in $BINARIES; do
            if [ "$OS" = "Windows" ]; then
              cp "target/$TARGET/release/$bin.exe" "$DEST/"
            else
              cp "target/$TARGET/release/$bin" "$DEST/"
            fi
          done

          if [ "$OS" = "Windows" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path '$DEST' -DestinationPath 'rdap-utils-${NAME}.zip'"
          else
            tar -czf "rdap-utils-${NAME}.tar.gz" "$DEST"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: rdap-utils-${{ matrix.name }}
          path: rdap-utils-${{ matrix.name }}.${{ matrix.ext }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/rdap-utils-linux-x86_64/rdap-utils-linux-x86_64.tar.gz
            dist/rdap-utils-linux-aarch64/rdap-utils-linux-aarch64.tar.gz
            dist/rdap-utils-apple-aarch64/rdap-utils-apple-aarch64.tar.gz
            dist/rdap-utils-windows-x86_64/rdap-utils-windows-x86_64.zip
          generate_release_notes: true
